<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Duas — Vem criar com a gente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=Cormorant+Garamond:wght@400;500;600;700&family=Parisienne&family=Varela+Round&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cd-mar-profundo:#031B56;
    --cd-oceano-siciliano:#032387;
    --cd-brisa-costa:#6E8DEC;
    --cd-folha-limoeiro:#30A092;
    --cd-roma-madura:#DB5B52;
    --cd-cha-rosas:#F0A1D3;
    --cd-limao-siciliano:#F2E43B;
    --cd-areia-clarinha:#FFF9EF;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    background-color:var(--cd-areia-clarinha);
    background-image:
      linear-gradient(90deg, rgba(3,27,86,0.05) 1px, transparent 1px),
      linear-gradient(0deg, rgba(3,27,86,0.05) 1px, transparent 1px);
    background-size: 28px 28px;
    font-family:'Montserrat', sans-serif;
    color:var(--cd-mar-profundo);
    display:flex;
    justify-content:center;
    padding:56px 20px 80px;
  }

  .page{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .emblem{
    width:96px;
    height:96px;
    margin-bottom:22px;
    box-shadow: 0 6px 0 rgba(3,27,86,0.12);
    border-radius:50%;
  }
  .emblem img{
    width:100%;
    height:100%;
    display:block;
    border-radius:50%;
  }

  .logo{
    text-align:center;
    line-height:0.9;
    margin-bottom:6px;
  }
  .logo .casa{
    display:block;
    font-family:'Bodoni Moda', serif;
    font-style:italic;
    font-weight:800;
    font-size:44px;
    color:var(--cd-mar-profundo);
    -webkit-text-stroke: 0.6px var(--cd-mar-profundo);
  }
  .logo .duas{
    display:block;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:30px;
    letter-spacing:0.32em;
    color:var(--cd-mar-profundo);
    margin-top:2px;
  }

  .tagline{
    font-family:'Varela Round', sans-serif;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--cd-oceano-siciliano);
    background:var(--cd-cha-rosas);
    padding:6px 16px;
    border-radius:999px;
    margin-top:14px;
    margin-bottom:34px;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .link-card{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:18px 22px;
    border-radius:20px;
    text-decoration:none;
    position:relative;
    transition:transform 0.15s ease;
  }
  .link-card:active{ transform:scale(0.98); }

  .link-icon{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    flex-shrink:0;
  }

  .link-text .title{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:21px;
    line-height:1.15;
  }
  .link-text .subtitle{
    font-family:'Montserrat', sans-serif;
    font-size:12.5px;
    opacity:0.85;
    margin-top:2px;
  }

  .link-loja{
    background:var(--cd-oceano-siciliano);
    color:var(--cd-areia-clarinha);
    border:2px solid var(--cd-mar-profundo);
  }
  .link-loja .link-icon{ background:var(--cd-limao-siciliano); color:var(--cd-mar-profundo); }
  .link-loja .subtitle{ color:var(--cd-brisa-costa); }

  .link-observatorio{
    background:var(--cd-areia-clarinha);
    color:var(--cd-mar-profundo);
    border:2px solid var(--cd-oceano-siciliano);
  }
  .link-observatorio .link-icon{ background:var(--cd-folha-limoeiro); color:var(--cd-areia-clarinha); }
  .link-observatorio .subtitle{ color:var(--cd-oceano-siciliano); opacity:0.75; }

  .link-instagram{
    background:var(--cd-cha-rosas);
    color:var(--cd-mar-profundo);
    border:2px solid var(--cd-roma-madura);
  }
  .link-instagram .link-icon{ background:var(--cd-roma-madura); color:var(--cd-areia-clarinha); }
  .link-instagram .subtitle{ color:var(--cd-mar-profundo); opacity:0.7; }

  .stamp{
    position:absolute;
    top:-10px;
    right:14px;
    font-family:'Varela Round', sans-serif;
    font-size:9.5px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    background:var(--cd-roma-madura);
    color:var(--cd-areia-clarinha);
    padding:3px 9px;
    border-radius:999px;
  }

  .signature{
    font-family:'Parisienne', cursive;
    font-size:22px;
    color:var(--cd-oceano-siciliano);
    margin-top:44px;
  }

  .footer{
    font-family:'Montserrat', sans-serif;
    font-size:11px;
    color:var(--cd-mar-profundo);
    opacity:0.55;
    margin-top:10px;
    text-align:center;
  }
</style>
</head>
